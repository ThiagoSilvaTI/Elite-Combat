<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#000205">
    <title>Admin Mobile | Elite Combat</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #000205;
            color: #fff;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 18px 14px calc(32px + env(safe-area-inset-bottom));
            background: #000205;
        }

        main {
            width: min(100%, 720px);
            margin: 0 auto;
        }

        .topbar,
        .topbar-actions,
        .card-heading,
        .card-actions,
        .section-heading {
            display: flex;
            align-items: center;
        }

        .topbar,
        .section-heading {
            justify-content: space-between;
            gap: 14px;
        }

        .topbar {
            align-items: flex-start;
            margin: 4px 0 18px;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.45rem, 7vw, 2rem);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        h1 span { color: #3284ff; }

        h2 {
            margin: 0;
            font-size: 1.2rem;
        }

        h3 {
            margin: 0;
            font-size: 1rem;
            overflow-wrap: anywhere;
        }

        p { line-height: 1.55; }

        .subtitle,
        .muted,
        .help {
            color: #a7b2c4;
        }

        .subtitle {
            margin: 7px 0 0;
            font-size: .88rem;
        }

        .topbar-actions {
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 8px;
        }

        button,
        .button {
            min-height: 42px;
            border: 0;
            border-radius: 8px;
            padding: 10px 13px;
            font: inherit;
            font-size: .82rem;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            touch-action: manipulation;
        }

        button:disabled { opacity: .6; cursor: wait; }
        .primary { color: #fff; background: #1268e8; }
        .secondary { color: #fff; background: #202b3d; }
        .danger { color: #fff; background: #c93838; }
        .success { color: #fff; background: #16865e; }
        .warning { color: #171100; background: #f2bd34; }

        .notice,
        .panel,
        .item-card,
        .stat {
            border: 1px solid rgba(77, 148, 255, .24);
            border-radius: 12px;
            background: #07101f;
        }

        .notice {
            margin-bottom: 16px;
            padding: 13px 14px;
            color: #f5ce61;
            background: #1b180b;
            font-size: .84rem;
            line-height: 1.5;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 9px;
            margin: 16px 0;
        }

        .stat {
            padding: 12px 8px;
            text-align: center;
        }

        .stat-value {
            display: block;
            color: #58a0ff;
            font-size: 1.45rem;
            font-weight: 800;
        }

        .stat-label {
            display: block;
            margin-top: 4px;
            color: #a7b2c4;
            font-size: .65rem;
            letter-spacing: .7px;
            text-transform: uppercase;
        }

        .toolbar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 9px;
            margin-bottom: 22px;
            padding: 13px;
        }

        .toolbar input[type="search"] {
            grid-column: 1 / -1;
        }

        input,
        select,
        textarea {
            width: 100%;
            min-height: 44px;
            border: 1px solid #35445c;
            border-radius: 8px;
            padding: 11px 12px;
            background: #020711;
            color: #fff;
            font: inherit;
            font-size: 16px;
        }

        input:focus,
        button:focus-visible,
        a:focus-visible,
        summary:focus-visible {
            outline: 2px solid #65a6ff;
            outline-offset: 2px;
        }

        .file-label {
            display: grid;
            place-items: center;
        }

        .section {
            margin-top: 28px;
        }

        .section-heading {
            margin-bottom: 12px;
        }

        .section-count {
            color: #9eb4d4;
            font-size: .82rem;
        }

        .list {
            display: grid;
            gap: 11px;
        }

        .item-card {
            min-width: 0;
            padding: 14px;
        }

        .card-heading {
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .badge {
            flex: 0 0 auto;
            border-radius: 999px;
            padding: 5px 8px;
            color: #d3e5ff;
            background: #142a47;
            font-size: .72rem;
            font-weight: 700;
        }

        .card-meta {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px 12px;
            margin: 13px 0;
        }

        .meta-item {
            min-width: 0;
            overflow-wrap: anywhere;
            color: #e4e9f1;
            font-size: .84rem;
            line-height: 1.45;
        }

        .meta-item strong {
            display: block;
            margin-bottom: 2px;
            color: #92a4bf;
            font-size: .66rem;
            letter-spacing: .7px;
            text-transform: uppercase;
        }

        .recommendation {
            margin: 13px 0;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .card-actions {
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .card-actions > * {
            flex: 1 1 120px;
        }

        details {
            margin-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, .1);
            padding-top: 10px;
        }

        summary {
            min-height: 38px;
            display: flex;
            align-items: center;
            color: #9dc5ff;
            font-size: .88rem;
            cursor: pointer;
        }

        .empty,
        .loading,
        .error {
            padding: 22px 14px;
            color: #a7b2c4;
            text-align: center;
        }

        .error { color: #ff9a9a; }

        .help {
            margin: 8px 0 12px;
            font-size: .82rem;
        }

        [hidden] { display: none !important; }

        @media (max-width: 380px) {
            body { padding-inline: 10px; }
            .topbar { flex-direction: column; }
            .topbar-actions { justify-content: flex-start; }
            .stats { gap: 6px; }
            .stat-label { font-size: .58rem; }
            .card-meta { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<main>
    <header class="topbar">
        <div>
            <h1>Admin <span>Elite</span></h1>
            <p class="subtitle">Painel administrativo mobile</p>
        </div>
        <div class="topbar-actions">
            <a class="button secondary" href="/admin">Versão desktop</a>
            <button class="primary" id="btnAtualizar" type="button">Atualizar</button>
        </div>
    </header>

    <div class="notice">
        Atenção: faça um backup antes de atualizar o site e importe-o novamente após a atualização.
    </div>

    <div class="stats" id="stats" aria-live="polite"></div>

    <section class="panel toolbar" aria-label="Ferramentas de inscrições">
        <input id="busca" type="search" placeholder="Buscar por nome, cadastro ou telefone" autocomplete="off">
        <a class="button success file-label" href="/api/admin/exportar" download>Exportar backup</a>
        <label class="button warning file-label" for="fileImport">Importar backup</label>
        <input id="fileImport" type="file" accept=".json,application/json" hidden>
    </section>

    <section class="section" aria-labelledby="inscricoesTitulo">
        <div class="section-heading">
            <h2 id="inscricoesTitulo">Inscrições</h2>
            <span id="inscricoesCount" class="section-count"></span>
        </div>
        <div id="inscricoes" class="list"><div class="loading">Carregando inscrições...</div></div>
    </section>

    <section class="section" aria-labelledby="feedbackTitulo">
        <div class="section-heading">
            <h2 id="feedbackTitulo">Feedbacks</h2>
            <span id="feedbackCount" class="section-count"></span>
        </div>
        <p class="help">Você pode remover avaliações a pedido do autor.</p>
        <div id="feedbacks" class="list"><div class="loading">Carregando feedbacks...</div></div>
    </section>
</main>

<script>
(() => {
    const api = {
        inscricoes: '/api/admin/inscricoes',
        exportar: '/api/admin/exportar',
        importar: '/api/admin/importar',
        removerInscricao: (numero) => `/api/admin/inscricao/${encodeURIComponent(numero)}`,
        feedbacks: '/api/admin/feedback',
        removerFeedback: (id) => `/api/admin/feedback/${encodeURIComponent(id)}`,
    };
    const inscricoesEl = document.getElementById('inscricoes');
    const feedbacksEl = document.getElementById('feedbacks');
    const buscaEl = document.getElementById('busca');
    let inscricoes = [];

    function escape(value) {
        return String(value == null ? '' : value).replace(/[&<>"']/g, (char) => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
        })[char]);
    }

    async function request(url, options) {
        const response = await fetch(url, options);
        const data = await response.json();
        if (!response.ok || !data.ok) {
            throw new Error(data.erro || `Falha na solicitação (${response.status}).`);
        }
        return data;
    }

    function setStats() {
        const hoje = new Date().toLocaleDateString('pt-BR');
        const hojeCount = inscricoes.filter((item) =>
            String(item.data_preenchimento || '').startsWith(hoje)
        ).length;
        const menores = inscricoes.filter((item) => Number(item.idade) < 18).length;
        document.getElementById('stats').innerHTML = `
            <div class="stat"><span class="stat-value">${inscricoes.length}</span><span class="stat-label">Inscrições</span></div>
            <div class="stat"><span class="stat-value">${hojeCount}</span><span class="stat-label">Hoje</span></div>
            <div class="stat"><span class="stat-value">${menores}</span><span class="stat-label">Menores</span></div>
        `;
    }

    function renderInscricoes(items) {
        document.getElementById('inscricoesCount').textContent =
            `${items.length} ${items.length === 1 ? 'resultado' : 'resultados'}`;
        if (!items.length) {
            inscricoesEl.innerHTML = '<div class="empty">Nenhuma inscrição encontrada.</div>';
            return;
        }
        inscricoesEl.innerHTML = items.map((item, index) => {
            const id = `inscricao-detalhes-${index}`;
            const turma = `${item.turma || 'Turma não informada'}${item.tipo_inscricao === 'instrutor' ? ' · Instrutor' : ''}`;
            const condicoes = Object.entries(item.saude || {})
                .filter(([key, value]) => /^q[1-8]$/.test(key) && value === 'sim')
                .map(([key]) => item.saude[`${key}_detalhe`] || key.toUpperCase());
            return `
                <article class="item-card">
                    <div class="card-heading">
                        <h3>${escape(item.nome)}</h3>
                        <span class="badge">${escape(item.idade)} anos</span>
                    </div>
                    <div class="card-meta">
                        <div class="meta-item"><strong>Cadastro</strong>${escape(item.numero_cadastro)}</div>
                        <div class="meta-item"><strong>Turma</strong>${escape(turma)}</div>
                        <div class="meta-item"><strong>Telefone</strong>${escape(item.telefone)}</div>
                        <div class="meta-item"><strong>Inscrição</strong>${escape(item.data_preenchimento)}</div>
                    </div>
                    <details>
                        <summary id="${id}">Ver detalhes da ficha</summary>
                        <div class="card-meta">
                            ${item.tipo_inscricao === 'instrutor' ? `<div class="meta-item"><strong>Turma de aula</strong>${escape(item.turma_aula || 'A definir')}</div>` : ''}
                            <div class="meta-item"><strong>Horário de treino</strong>${escape(item.periodo || 'Não informado')}</div>
                            <div class="meta-item"><strong>Horário</strong>${escape(item.horario || 'Não informado')}</div>
                            <div class="meta-item"><strong>Objetivo</strong>${escape(item.objetivo || 'Não informado')}</div>
                            <div class="meta-item"><strong>Responsável</strong>${escape(item.resp_nome || 'Não informado')}</div>
                            <div class="meta-item"><strong>Telefone do responsável</strong>${escape(item.resp_telefone || 'Não informado')}</div>
                            <div class="meta-item"><strong>Emergência</strong>${escape(item.emerg_nome || 'Não informado')}</div>
                            <div class="meta-item"><strong>Telefone de emergência</strong>${escape(item.emerg_telefone || 'Não informado')}</div>
                            <div class="meta-item"><strong>Condições de saúde</strong>${escape(condicoes.length ? condicoes.join('; ') : 'Nenhuma informada')}</div>
                            <div class="meta-item"><strong>Adaptações</strong>${escape(item.adaptacoes || 'Nenhuma informada')}</div>
                        </div>
                    </details>
                    <div class="card-actions">
                        ${item.tem_contrato ? `<a class="button secondary" href="/api/contrato/${encodeURIComponent(item.numero_cadastro)}">Contrato</a>` : ''}
                        <button class="danger" type="button" data-remover-inscricao="${escape(item.numero_cadastro)}">Remover inscrição</button>
                    </div>
                </article>
            `;
        }).join('');
    }

    function renderFeedbacks(items) {
        document.getElementById('feedbackCount').textContent =
            `${items.length} ${items.length === 1 ? 'feedback' : 'feedbacks'}`;
        if (!items.length) {
            feedbacksEl.innerHTML = '<div class="empty">Nenhum feedback publicado.</div>';
            return;
        }
        feedbacksEl.innerHTML = items.map((item) => `
            <article class="item-card">
                <div class="card-heading">
                    <h3>${escape(item.email)}</h3>
                    <span class="badge">${escape(item.nota)} / 5 ★</span>
                </div>
                <p class="recommendation">${escape(item.recomendacao)}</p>
                <p class="muted">Atualizado em ${escape(item.atualizado_em)}</p>
                <div class="card-actions">
                    <button class="danger" type="button" data-remover-feedback="${Number(item.id)}">Remover feedback</button>
                </div>
            </article>
        `).join('');
    }

    async function carregarInscricoes() {
        inscricoesEl.innerHTML = '<div class="loading">Carregando inscrições...</div>';
        try {
            const data = await request(api.inscricoes);
            inscricoes = data.inscricoes || [];
            setStats();
            aplicarBusca();
        } catch (error) {
            inscricoesEl.innerHTML = `<div class="error">${escape(error.message)}</div>`;
        }
    }

    async function carregarFeedbacks() {
        feedbacksEl.innerHTML = '<div class="loading">Carregando feedbacks...</div>';
        try {
            const data = await request(api.feedbacks);
            renderFeedbacks(data.feedbacks || []);
        } catch (error) {
            feedbacksEl.innerHTML = `<div class="error">${escape(error.message)}</div>`;
        }
    }

    function aplicarBusca() {
        const query = buscaEl.value.trim().toLocaleLowerCase('pt-BR');
        const filtradas = inscricoes.filter((item) =>
            [item.nome, item.numero_cadastro, item.telefone, item.turma, item.tipo_inscricao]
                .some((value) => String(value || '').toLocaleLowerCase('pt-BR').includes(query))
        );
        renderInscricoes(filtradas);
    }

    async function atualizar() {
        await Promise.all([carregarInscricoes(), carregarFeedbacks()]);
    }

    document.getElementById('btnAtualizar').addEventListener('click', atualizar);
    buscaEl.addEventListener('input', aplicarBusca);

    inscricoesEl.addEventListener('click', async (event) => {
        const button = event.target.closest('[data-remover-inscricao]');
        if (!button) return;
        const numero = button.dataset.removerInscricao;
        if (!confirm(`Remover a inscrição ${numero} e o contrato associado?`)) return;
        button.disabled = true;
        try {
            await request(api.removerInscricao(numero), { method: 'DELETE' });
            await carregarInscricoes();
        } catch (error) {
            alert(error.message);
            button.disabled = false;
        }
    });

    feedbacksEl.addEventListener('click', async (event) => {
        const button = event.target.closest('[data-remover-feedback]');
        if (!button) return;
        if (!confirm('Remover permanentemente este feedback?')) return;
        button.disabled = true;
        try {
            await request(api.removerFeedback(button.dataset.removerFeedback), { method: 'DELETE' });
            await carregarFeedbacks();
        } catch (error) {
            alert(error.message);
            button.disabled = false;
        }
    });

    document.getElementById('fileImport').addEventListener('change', async (event) => {
        const file = event.target.files[0];
        if (!file) return;
        try {
            const payload = JSON.parse(await file.text());
            if (!Array.isArray(payload.inscricoes)) {
                throw new Error('O backup precisa conter uma lista de inscrições.');
            }
            const quantidadeFeedbacks = Array.isArray(payload.feedbacks) ? payload.feedbacks.length : 0;
            if (!confirm(`Importar ${payload.inscricoes.length} inscrições e ${quantidadeFeedbacks} feedbacks? Registros existentes serão ignorados.`)) return;
            const data = await request(api.importar, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
            });
            alert(`Inscrições importadas: ${data.importados}\nInscrições ignoradas: ${data.ignorados}\nFeedbacks importados: ${data.feedbacks_importados}\nFeedbacks ignorados: ${data.feedbacks_ignorados}`);
            await carregarInscricoes();
        } catch (error) {
            alert(error.message || 'Não foi possível importar o backup.');
        } finally {
            event.target.value = '';
        }
    });

    atualizar();
})();
</script>
</body>
</html>
